{% extends "base.html" %}
{% block title %}Excluir objeto | Achados UFLA{% endblock %}
{% block content %}
<section class="confirm-card">
  <p class="eyebrow">CONFIRMAÇÃO</p>
  <h1>Excluir “{{ object.title }}”?</h1>
  <p>Esta ação também remove as ocorrências relacionadas ao objeto e não pode ser desfeita.</p>
  <form method="post" class="confirm-actions">{% csrf_token %}<button class="button button-danger" type="submit">Excluir objeto</button><a class="button button-secondary" href="{% url 'items:detail' object.pk %}">Manter objeto</a></form>
</section>
{% endblock %}
